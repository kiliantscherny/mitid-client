env_list = ["py310", "py311", "py312", "py313", "py314", "lint", "typecheck"]

[env_run_base]
description = "Run the tests"
dependency_groups = ["dev"]
# The Textual screen is part of the library, so it gets exercised too.
extras = ["textual"]
commands = [["pytest"]]

[env.lint]
description = "Run the linter and the formatter check"
skip_install = true
# Pinned, like ty below. Ruff's formatter changes between releases (0.16
# started formatting Python blocks inside Markdown), so a floating version
# means CI, tox and the pre-commit hook can disagree about the same file.
deps = ["ruff==0.16.5"]
commands = [["ruff", "check", "."], ["ruff", "format", "--check", "."]]

[env.typecheck]
description = "Run the type checker"
# Pinned: ty is pre-1.0 and moves quickly. Bump it deliberately and deal with
# whatever it has newly learned to find, rather than being surprised in CI.
deps = ["ty==0.0.37"]
commands = [["ty", "check"]]
